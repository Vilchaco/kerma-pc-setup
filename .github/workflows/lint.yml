name: Lint

# Checks the scripts with the same Windows PowerShell 5.1 the casino PCs use.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Windows PowerShell 5.1
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Scripts are plain ASCII
        shell: powershell
        run: |
          $bad = @()
          @(Get-ChildItem src -File -Recurse -Include *.ps1, *.psd1, *.bat, *.cmd) + @(Get-ChildItem -File -Filter *.ps1) | ForEach-Object {
            $bytes = [IO.File]::ReadAllBytes($_.FullName)
            # UTF-8 with BOM is fine (PowerShell 5.1 reads it right); without BOM only plain ASCII
            $bom = $bytes.Length -ge 3 -and $bytes[0] -eq 0xEF -and $bytes[1] -eq 0xBB -and $bytes[2] -eq 0xBF
            if (-not $bom -and ($bytes | Where-Object { $_ -gt 127 } | Select-Object -First 1)) { $bad += $_.Name }
          }
          foreach ($n in $bad) { "::error file=$n::Non-ASCII characters without a UTF-8 BOM. Windows PowerShell 5.1 would read them wrong: save the file as UTF-8 with BOM, or use plain ASCII." }
          if ($bad.Count) { exit 1 }
          'OK: all scripts are ASCII or UTF-8 with BOM'

      - name: No secrets in assets
        shell: powershell
        run: |
          $bad = @(Get-ChildItem assets -Recurse -File -ErrorAction SilentlyContinue | Where-Object { $_.Name -eq 'service.json' })
          foreach ($f in $bad) { "::error file=$($f.FullName.Substring((Get-Location).Path.Length + 1))::service.json holds the OBS stream key. Never commit it to this public repo." }
          if ($bad.Count) { exit 1 }
          'OK: no OBS service.json in assets'

      - name: Syntax check (PowerShell 5.1 parser)
        shell: powershell
        run: |
          $files = @(Get-ChildItem src -Filter *.ps1 -Recurse) + @(Get-ChildItem -File -Filter *.ps1)
          if ($files.Count -eq 0) { 'No .ps1 files in this version'; exit 0 }
          $failed = $false
          foreach ($f in $files) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($f.FullName, [ref]$tokens, [ref]$errors)
            if ($errors.Count) {
              $failed = $true
              foreach ($e in $errors) { "::error file=$($f.Name),line=$($e.Extent.StartLineNumber),col=$($e.Extent.StartColumnNumber)::$($e.Message)" }
            } else { "OK: $($f.Name)" }
          }
          if ($failed) { exit 1 }

      - name: Configuration check (inventory, profiles, programs, assets)
        shell: powershell
        run: |
          powershell -NoProfile -ExecutionPolicy Bypass -File src/Kerma-PCSetup.ps1 -ValidateConfig
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: PSScriptAnalyzer (errors only)
        shell: powershell
        run: |
          if (-not (Get-ChildItem src -Filter *.ps1 -Recurse)) { 'No .ps1 files'; exit 0 }
          if (-not (Get-Module -ListAvailable PSScriptAnalyzer)) {
            Set-PSRepository PSGallery -InstallationPolicy Trusted
            Install-Module PSScriptAnalyzer -Scope CurrentUser -Force
          }
          $r = @(Invoke-ScriptAnalyzer -Path src -Recurse -Severity Error) + @(Get-ChildItem -File -Filter *.ps1 | ForEach-Object { Invoke-ScriptAnalyzer -Path $_.FullName -Severity Error })
          foreach ($i in $r) { "::error file=src/$($i.ScriptName),line=$($i.Line)::[$($i.RuleName)] $($i.Message)" }
          if ($r.Count) { exit 1 }
          'OK: no PSScriptAnalyzer errors'
