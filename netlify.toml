# kermasetup.netlify.app
#   /         -> navegador: pagina de bienvenida (web/index.html)
#                PowerShell / curl: 302 al bootstrap.ps1 de main (la instalacion de una linea)
#                (netlify/edge-functions/root.ts decide)
#   /estado   -> panel de estado de los PCs (PIN)
#   /api/*    -> API del panel (netlify/functions/status.mjs)
[build]
  publish = "web"

[functions]
  directory = "netlify/functions"
